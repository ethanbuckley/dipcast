# Fly.io app definition. Deploy from the project root after building the data
# locally (see README "Run"): `fly launch --no-deploy` once, then `fly deploy`.
app = "dipcast"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  DIPCAST_STATE = "/state"           # mutable files on the volume below
  DIPCAST_REFRESH_MINUTES = "20"     # in-process live refresh
  PYTHONUNBUFFERED = "1"

[[mounts]]
  source = "dipcast_state"
  destination = "/state"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"         # the refresh loop and live scoring need the app running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "90s"             # the river network takes a few seconds to load
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
