# Fly.io app definition (format as rewritten by `fly launch`). Deploy from the
# project root with `fly deploy` after building the data locally (README "Run").
# DIPCAST_STATE points at the volume; the in-process refresh keeps live status
# and the forecast log current, so auto-stop stays off.

app = 'dipcast'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  DIPCAST_REFRESH_MINUTES = '20'
  DIPCAST_STATE = '/state'
  PYTHONUNBUFFERED = '1'

[[mounts]]
  source = 'dipcast_state'
  destination = '/state'
  initial_size = '1gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '1m30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
