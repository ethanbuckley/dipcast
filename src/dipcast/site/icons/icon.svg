<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Dipspot</title>
  <!-- A river, an overflow on its bank upstream (orange) and a swim spot downstream (white ring).
       Full bleed so iOS can round the corners; the dot and ring sit inside the central
       circle of radius 205 that Android keeps for maskable icons. -->
  <rect width="512" height="512" fill="#0F5A61"/>
  <path d="M 430 -20 C 330 110, 470 230, 300 290 S 110 380, 190 540" fill="none" stroke="#5CC2B5" stroke-width="70" stroke-linecap="round"/>
  <circle cx="318" cy="138" r="38" fill="#F08A4B"/>
  <circle cx="165" cy="358" r="46" fill="none" stroke="#FFFFFF" stroke-width="22"/>
</svg>
