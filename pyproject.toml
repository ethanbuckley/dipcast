[project]
name = "dipcast"
version = "0.1.0"
description = "Probabilistic sewage-pollution forecasts for river and lake swim spots in England, from open storm-overflow, rainfall and river-network data."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "geopandas>=1.0",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyarrow>=17",
]

[project.optional-dependencies]
bayes = ["pymc>=5.16", "arviz>=0.19"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dipcast"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
