name: Request a swim spot
description: Ask for a river or lake spot to be added to SwimSignal's forecasts
title: "Spot request: "
labels: [spot-request]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Ask only for places the public can reach, and leave out your address and anything else personal. Adding a spot is not a statement that it is safe to swim there.

        An automatic check replies on this issue with where the spot lands on SwimSignal's river map: the river or lake, how far your point is from it, how many monitored storm overflows are upstream, and a row for the spot list. If it cannot read the location it asks for coordinates, and it checks again when you edit the issue. A maintainer reads every request before a spot is added.
  - type: input
    id: name
    attributes:
      label: Spot name
      description: River or lake and the place, e.g. "River Wharfe, Bolton Abbey"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: Latitude and longitude (right-click in Google Maps to copy them) or an OS grid reference such as SD 7262 4130, precise to about 100 m. A what3words address or a description may get a reply asking for coordinates.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Water body
      options: [river, lake]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Access notes, hazards worth flagging, or why this spot matters
