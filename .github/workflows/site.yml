name: Build and publish site

on:
  schedule:
    - cron: "*/30 * * * *"        # every 30 minutes; GitHub may delay by a few minutes
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [spots.csv, "src/**", scripts/build_site.py, .github/workflows/site.yml]

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: write     # release assets for state, monthly heartbeat commit
  pages: write
  id-token: write

env:
  DIPCAST_STATE: ${{ github.workspace }}/state
  DIPCAST_CACHE: ${{ github.workspace }}/state/cache   # rainfall cache persists with the state
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Tests (the build does not run if these fail)
        run: uv run pytest -q

      - name: Restore mutable state (live history, forecast log)
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: dipcast-state-${{ github.run_id }}
          restore-keys: dipcast-state-

      - name: Fetch state from the rolling release if the cache was cold
        if: steps.state-cache.outputs.cache-matched-key == ''
        run: |
          mkdir -p state
          gh release download state -D state --clobber || echo "no state release yet"

      - name: Fetch the river network (113 MB, too large for git)
        run: |
          test -f data/processed/river_network.pkl || gh release download data-v1 -p river_network.pkl -D data/processed

      - name: Build forecasts and site
        env:
          DIPCAST_CF_BEACON_TOKEN: ${{ vars.DIPCAST_CF_BEACON_TOKEN }}   # page-view counter; unset = off
        run: uv run python scripts/build_site.py

      - name: Save mutable state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: dipcast-state-${{ github.run_id }}

      - name: Publish state to the rolling release (durable copy, when over 12 hours old)
        continue-on-error: true
        run: |
          # GitHub runs the schedule a few times a day at irregular times, so a fixed clock window
          # was missed for a week at a time. Publish when the release copy of any of these files is
          # over max_h hours old or missing (a failed --clobber upload deletes it), and on every
          # manual run. All files go up together, so the copy is one run's snapshot.
          max_h=12
          files=(state/live_history.parquet state/live_latest.parquet state/dipcast.duckdb state/verification_live.json)
          for f in state/live_coverage.parquet state/poll_log.parquet state/ecoli_samples.parquet state/ecoli_samples_status.json; do
            if [ -f "$f" ]; then files+=("$f"); fi   # later additions, uploaded once the build has written them
          done
          if ! assets=$(gh release view state --json assets); then
            gh release create state --title "Rolling state" --notes "Live polls, forecast log and live scores. Replaced twice a day by the site workflow." --latest=false
            assets='{"assets":[]}'
          fi
          stale=$(jq -r --argjson h "$max_h" --args '
              (now - $h*3600 | todate) as $cutoff | (.assets | map({(.name): .updatedAt}) | add // {}) as $up
              | [$ARGS.positional[] | select(($up[.] // "") < $cutoff)] | join(" ")
            ' "${files[@]#state/}" <<<"$assets") || stale="(could not read the release's assets)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -n "$stale" ]; then
            echo "Publishing ${#files[@]} files. Over $max_h h old or missing in the release: ${stale:-none (manual run)}"
            gh release upload state "${files[@]}" --clobber
          else
            echo "All ${#files[@]} release copies are under $max_h h old; not publishing."
          fi

      - name: Monthly heartbeat commit (keeps the schedule enabled)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 30 ]; then
            git config user.name "dipcast-bot"; git config user.email "bot@dipcast.invalid"
            date -u +"%Y-%m-%d %H:%M UTC" > HEARTBEAT.md && git add HEARTBEAT.md && git commit -m "Monthly heartbeat" && git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
