name: Test reviews

on:
  pull_request:
    paths: ["reviews/**", ".github/workflows/reviews-tests.yml"]
  push:
    branches: [main]
    paths: ["reviews/**", ".github/workflows/reviews-tests.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # node:sqlite stands in for D1 in the tests; 24 has it without a flag
      - name: Test submissions, photos, moderation and the rate limits
        run: node --test reviews/test/*.test.js
